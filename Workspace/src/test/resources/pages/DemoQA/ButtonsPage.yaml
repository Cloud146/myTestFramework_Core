PageInfo:
  project: DemoQA
  feature: Buttons
  name: Buttons Page
  url: https://demoqa.com/buttons

elements:
  Double Click Me:
    type: button
    locator:
      by: css
      value: button[id='doubleClickBtn']
  Double Click Message:
    type: text
    locator:
      by: id
      value: doubleClickMessage
  Right Click Me:
    type: button
    locator:
      by: id
      value: rightClickBtn
  Right Click Message:
    type: text
    locator:
      by: id
      value: rightClickMessage
  Click Me:
    type: button
    locator:
      by: xpath
      value: "//button[text()='Click Me']"
  Dynamic Click Message:
    type: text
    locator:
      by: id
      value: dynamicClickMessage
