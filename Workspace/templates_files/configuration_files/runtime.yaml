# Глобальные настройки фреймворка

ui_engine: selenium
# Возможные значения: chrome | firefox | edge
browser: chrome

pages_dir: "pages"
testData_dir: "testData"
logback_config: logback.xml

# Количество повторных запусков упавшего теста
retry:
  count: 0

cucumber_settings:
  parallel: true
  threads: 5
  # Возможные значения: scenario | tag
  run_by: scenario
  value: "Тест двойного клика"

